[project]
name = "microstack-testcontainers-python-example"
version = "0.1.0"
description = "MicroStack integration test example using testcontainers-python"
requires-python = ">=3.10"
dependencies = [
    "boto3==1.44.0",
    "pytest==9.2.0",
    "testcontainers==4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

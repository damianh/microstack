name: Release

on:
  workflow_dispatch:
    inputs:
      push_to_nuget:
        description: 'Push to NuGet.org'
        required: false
        type: boolean
        default: false

# Releases allocate the next YYYY.MMDD.N version from existing tags, so they must run one at a time.
# Never cancel a release that is already publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: nuget.org
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Resolve calendar version
        id: version
        run: |
          VERSION="$(dotnet run --file scripts/calendar-version.cs)"
          echo "Release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # MSBuild reads environment variables as properties, so every build, pack, and publish uses this exact version.
          echo "MinVerVersionOverride=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: examples/testcontainers/java/pom.xml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: examples/testcontainers/go/go.mod
          cache-dependency-path: examples/testcontainers/go/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/testcontainers/typescript/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: examples/testcontainers/python/requirements.lock

      - name: Ensure tag is not already released
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! EXISTING_TAG="$(git ls-remote --tags --refs origin "refs/tags/$TAG")"; then
            echo "Failed to check whether $TAG exists on origin."
            exit 1
          fi
          if [ -n "$EXISTING_TAG" ]; then
            echo "Tag $TAG already exists on origin. Refusing to re-release."
            exit 1
          fi

      # Create the tag locally; it is pushed only after everything is published.
      - name: Create local tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${{ steps.version.outputs.version }}"

      - name: Restore
        run: dotnet restore MicroStack.slnx

      - name: Build
        run: dotnet build MicroStack.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --project tests/MicroStack.Tests/MicroStack.Tests.csproj -c Release --no-build

      - name: Test UI components
        run: dotnet test --project tests/MicroStack.UI.Tests/MicroStack.UI.Tests.csproj -c Release --no-build

      - name: Pack NuGet packages
        run: dotnet pack src/MicroStack.Aspire.Hosting/MicroStack.Aspire.Hosting.csproj -c Release --no-build --output ./packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v5
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: ./packages/*.nupkg

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        run: >
          docker build
          -t ghcr.io/${{ github.repository_owner }}/microstack:${{ steps.version.outputs.version }}
          -t ghcr.io/${{ github.repository_owner }}/microstack:latest
          --build-arg MICROSTACK_VERSION=${{ steps.version.outputs.version }}
          .

      - name: Test container contract
        env:
          MICROSTACK_TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/microstack:${{ steps.version.outputs.version }}
        run: dotnet test --project tests/MicroStack.Testcontainers.Tests/MicroStack.Testcontainers.Tests.csproj -c Release

      - name: Test .NET Testcontainers example
        env:
          MICROSTACK_TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/microstack:${{ steps.version.outputs.version }}
        run: dotnet test --project examples/testcontainers/dotnet/MicroStack.Testcontainers.Example.csproj -c Release

      - name: Test Java Testcontainers example
        working-directory: examples/testcontainers/java
        env:
          MICROSTACK_TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/microstack:${{ steps.version.outputs.version }}
        run: mvn --batch-mode test

      - name: Test Go Testcontainers example
        working-directory: examples/testcontainers/go
        env:
          MICROSTACK_TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/microstack:${{ steps.version.outputs.version }}
        run: go test ./...

      - name: Test Python Testcontainers example
        env:
          MICROSTACK_TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/microstack:${{ steps.version.outputs.version }}
        run: |
          python -m pip install --require-hashes -r examples/testcontainers/python/requirements.lock
          python -m pytest -q examples/testcontainers/python

      - name: Test TypeScript Testcontainers example
        working-directory: examples/testcontainers/typescript
        env:
          MICROSTACK_TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/microstack:${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Smoke test container
        env:
          MICROSTACK_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: sh scripts/smoke-container.sh ghcr.io/${{ github.repository_owner }}/microstack:${{ steps.version.outputs.version }}

      - name: Push container image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/microstack:${{ steps.version.outputs.version }}
          docker push ghcr.io/${{ github.repository_owner }}/microstack:latest

      - name: Push to NuGet.org
        if: ${{ inputs.push_to_nuget }}
        run: dotnet nuget push "./packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_ORG_APIKEY }}

      - name: Push tag
        run: git push origin "v${{ steps.version.outputs.version }}"

      - name: Select release notes
        id: notes
        run: |
          NOTES=".github/release-notes/v${{ steps.version.outputs.version }}.md"
          if [ ! -f "$NOTES" ]; then
            echo "No curated release notes at $NOTES; using generated notes only."
            NOTES=""
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MicroStack ${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: false
          generate_release_notes: true
